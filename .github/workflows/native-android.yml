name: native-android

on:
  workflow_dispatch:
  push:
    # Feature branch publishes the first aarch64-android nightly asset
    # before this lands on main. Drop the extra branch after merge.
    branches: [main, cursor/android-native-ae0d]
    paths:
      - "src/**"
      - "tools/**"
      - "deps/**"
      - "patches/**"
      - "include/**"
      - "tests/**"
      - "build.zig"
      - ".github/workflows/native-android.yml"

permissions:
  contents: write

jobs:
  aarch64-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FUN_GRAPHICS_JOBS: "3"
      FUN_GRAPHICS_TARGET: android
      FUN_GRAPHICS_ANDROID_ABI: arm64-v8a
      FUN_GRAPHICS_ANDROID_API: "26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 protobuf-compiler

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Restore native cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/fun-graphics/git
            ~/.cache/fun-graphics/worktrees
            ~/.cache/fun-graphics/native
          key: native-android-aarch64-${{ hashFiles('deps/versions.zig') }}
          restore-keys: |
            native-android-aarch64-

      - name: Disk before
        run: df -h

      - name: Build native (Dawn Vulkan + Skia Graphite + bridge, Android NDK)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: zig build native -Dandroid

      - name: Pack Release tarball
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: zig build pack-native -Dandroid

      - name: Upload aarch64-android asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="${HOME}/.cache/fun-graphics/releases/fun-graphics-native-aarch64-android.tar.gz"
          test -f "${asset}"
          sha256sum "${asset}"
          ls -lh "${asset}"
          sh tools/publish_native.sh "${asset}" "${GITHUB_REPOSITORY}"

      - name: Stub ABI tests
        run: zig build test

      - name: Save native cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/fun-graphics/git
            ~/.cache/fun-graphics/worktrees
            ~/.cache/fun-graphics/native
          key: native-android-aarch64-${{ hashFiles('deps/versions.zig') }}-${{ github.run_id }}

      - name: Disk after
        if: always()
        run: df -h
